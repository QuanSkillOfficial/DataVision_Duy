services:
  db:
    image: pgvector/pgvector:pg16
    container_name: datavision-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - datavision_pgdata:/var/lib/postgresql/data

volumes:
  datavision_pgdata:
