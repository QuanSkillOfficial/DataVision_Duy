[pytest]
pythonpath = .
testpaths = tests
markers =
    e2e: browser end-to-end test; starts a real UI and backend and drives a browser
    integration: test that uses a disposable local PostgreSQL database
    live_db: test that targets an explicitly enabled external staging database
    staging: e2e test that can run against an already-deployed UI (DV-HUNG-06).
        Tests without this marker need a UI they control - a dead backend or a
        fault-injectable stub - so they can only describe a local stack.

# Browser tests are excluded by default: they take minutes, need a Chromium
# install, and are gated separately in CI by scripts/week8_run_browser_e2e.py.
# Run them explicitly with:
#     python -m pytest tests/e2e -m e2e
addopts = -p no:cacheprovider -m "not e2e"
