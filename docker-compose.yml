services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datavision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datavision123}
      POSTGRES_DB: ${POSTGRES_DB:-datavision_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - datavision_pgdata:/var/lib/postgresql/data
      - ./deployment/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-datavision} -d ${POSTGRES_DB:-datavision_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend_stub/Dockerfile
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  ingestion-smoke:
    profiles: ["data"]
    build:
      context: .
      dockerfile: deployment/Dockerfile.data
    command: ["python", "scripts/week7_ci_ingestion_smoke_test.py"]

  ui:
    profiles: ["ui"]
    image: ${UI_IMAGE:-datavision-ui:week7-local}
    environment:
      QS_USE_BACKEND: ${QS_USE_BACKEND:-false}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000/api}
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datavision_pgdata:
