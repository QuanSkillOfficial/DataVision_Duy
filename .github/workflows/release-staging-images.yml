name: Publish staging images

on:
  workflow_run:
    workflows: ["DataVision CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full green commit SHA to publish (defaults to current main)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      image_prefix: ${{ steps.release.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Resolve immutable release identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          release_sha="$REQUESTED_SHA"
          if [ -z "$release_sha" ]; then
            release_sha="$CI_SHA"
          fi
          if [ -z "$release_sha" ]; then
            release_sha="$(git rev-parse HEAD)"
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character lowercase Git SHA is required." >&2
            exit 1
          fi
          git cat-file -e "${release_sha}^{commit}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datavision"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$image_prefix" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend_stub/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-backend:${{ needs.prepare.outputs.release_sha }}
            ${{ needs.prepare.outputs.image_prefix }}-backend:staging-latest
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: ui
        name: Publish UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-ui:${{ needs.prepare.outputs.release_sha }}
            ${{ needs.prepare.outputs.image_prefix }}-ui:staging-latest
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - id: seed
        name: Publish integration seed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.integration
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-seed:${{ needs.prepare.outputs.release_sha }}
            ${{ needs.prepare.outputs.image_prefix }}-seed:staging-latest
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=seed
          cache-to: type=gha,mode=max,scope=seed
      - name: Record release manifest with registry digests
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
          SEED_DIGEST: ${{ steps.seed.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          prefix = os.environ["IMAGE_PREFIX"]
          sha = os.environ["RELEASE_SHA"]
          manifest = {
              "release_sha": sha,
              "created_at": datetime.now(timezone.utc).isoformat(),
              "images": {
                  "backend": {"tag": f"{prefix}-backend:{sha}", "digest": os.environ["BACKEND_DIGEST"]},
                  "ui": {"tag": f"{prefix}-ui:{sha}", "digest": os.environ["UI_DIGEST"]},
                  "seed": {"tag": f"{prefix}-seed:{sha}", "digest": os.environ["SEED_DIGEST"]},
              },
          }
          with open("release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: week8-release-${{ needs.prepare.outputs.release_sha }}
          path: release-manifest.json
          if-no-files-found: error
