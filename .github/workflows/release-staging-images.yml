name: Publish staging images

on:
  workflow_run:
    workflows: ["DataVision CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full green commit SHA to publish (defaults to current main)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      image_prefix: ${{ steps.release.outputs.image_prefix }}
      source_ci_run_id: ${{ steps.release.outputs.source_ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: release
        name: Resolve immutable release identity
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_sha="$REQUESTED_SHA"
          if [ -z "$release_sha" ]; then
            release_sha="$CI_SHA"
          fi
          if [ -z "$release_sha" ]; then
            release_sha="$(git rev-parse HEAD)"
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full 40-character lowercase Git SHA is required." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          expected_run=()
          if [ -n "$SOURCE_RUN_ID" ]; then
            expected_run=(--expected-run-id "$SOURCE_RUN_ID")
          fi
          python scripts/verify_release_candidate.py \
            --sha "$release_sha" \
            --repository "$GITHUB_REPOSITORY" \
            --main-ref origin/main \
            --github-env "$GITHUB_ENV" \
            "${expected_run[@]}"
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/datavision"
          source_ci_run_id="$(sed -n 's/^VERIFIED_CI_RUN_ID=//p' "$GITHUB_ENV" | tail -n 1)"
          [ -n "$source_ci_run_id" ] || { echo "Verified CI run ID was not produced" >&2; exit 1; }
          {
            echo "release_sha=$release_sha"
            echo "image_prefix=$image_prefix"
            echo "source_ci_run_id=$source_ci_run_id"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend_stub/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-backend:${{ needs.prepare.outputs.release_sha }}
            ${{ needs.prepare.outputs.image_prefix }}-backend:staging-latest
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: ui
        name: Publish UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-ui:${{ needs.prepare.outputs.release_sha }}
            ${{ needs.prepare.outputs.image_prefix }}-ui:staging-latest
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - id: seed
        name: Publish integration seed image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile.integration
          push: true
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}-seed:${{ needs.prepare.outputs.release_sha }}
            ${{ needs.prepare.outputs.image_prefix }}-seed:staging-latest
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=seed
          cache-to: type=gha,mode=max,scope=seed
      - name: Record release manifest with registry digests
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
          SEED_DIGEST: ${{ steps.seed.outputs.digest }}
          SOURCE_CI_RUN_ID: ${{ needs.prepare.outputs.source_ci_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          prefix = os.environ["IMAGE_PREFIX"]
          sha = os.environ["RELEASE_SHA"]
          manifest = {
              "schema_version": 1,
              "release_sha": sha,
              "source_ci_run_id": int(os.environ["SOURCE_CI_RUN_ID"]),
              "created_at": datetime.now(timezone.utc).isoformat(),
              "images": {},
          }
          for service, digest in {
              "backend": os.environ["BACKEND_DIGEST"],
              "ui": os.environ["UI_DIGEST"],
              "seed": os.environ["SEED_DIGEST"],
          }.items():
              repository = f"{prefix}-{service}"
              manifest["images"][service] = {
                  "repository": repository,
                  "tag": f"{repository}:{sha}",
                  "digest": digest,
                  "ref": f"{repository}@{digest}",
              }
          with open("release-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
          PY
          python scripts/validate_release_manifest.py \
            --manifest release-manifest.json \
            --expected-sha "$RELEASE_SHA" \
            --image-prefix "$IMAGE_PREFIX" \
            --github-env "$GITHUB_ENV"
      - name: Scan exact published images and generate SBOMs
        shell: bash
        run: |
          mkdir -p image-security
          for service in backend ui seed; do
            variable="${service^^}_IMAGE_REF"
            image_ref="${!variable}"
            docker pull "$image_ref"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/image-security:/evidence" \
              aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
              --severity CRITICAL,HIGH --exit-code 0 \
              --format json --output "/evidence/${service}-trivy.json" "$image_ref"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image --quiet \
              --ignore-unfixed --severity CRITICAL --exit-code 1 "$image_ref"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/image-security:/evidence" \
              aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
              --format cyclonedx --output "/evidence/${service}.cdx.json" "$image_ref"
          done
      - name: Upload exact-image security evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: week8-image-security-${{ needs.prepare.outputs.release_sha }}
          path: image-security/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: week8-release-${{ needs.prepare.outputs.release_sha }}
          path: release-manifest.json
          if-no-files-found: error
