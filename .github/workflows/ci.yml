name: DataVision CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical module provenance and required paths
        run: python scripts/verify_module_provenance.py

  data-engineering-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Build shared CI fixtures
        run: python scripts/week7_build_shared_test_fixtures.py
      - name: Run ingestion CI smoke test
        run: python scripts/week7_ci_ingestion_smoke_test.py
      - name: Run data engineering tests
        run: pytest tests/data_tests/ -q
      - name: Validate Week 7 data pipeline contracts
        run: python scripts/week7_data_pipeline_smoke_test.py

  data-db-loading-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: datavision
          POSTGRES_PASSWORD: datavision123
          POSTGRES_DB: datavision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datavision -d datavision_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: datavision_db
      DB_USER: datavision
      DB_PASSWORD: datavision123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Apply pinned Phat schema contract
        run: python scripts/week7_apply_database_schema.py
      - name: Load current Duy runs in DB smoke mode
        run: python scripts/load_ingestion_outputs_to_postgres.py --write-db --smoke
      - name: Build DB-enriched handoffs
        run: |
          python scripts/week7_build_rag_handoff_package.py
          python scripts/week7_build_prediction_payloads.py
          python scripts/week7_build_ui_fixtures.py
      - name: Verify current-run DB proof and handoffs
        run: >-
          python scripts/week7_verify_db_load_result.py
          --expected-structured-records 100
          --verify-handoffs

  backend-contract-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend_stub/requirements.txt
      - name: Install backend stub dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend_stub/requirements.txt
          python -m pip check
      - name: Start backend contract stub
        run: |
          nohup uvicorn backend_stub.main:app --host 127.0.0.1 --port 8000 >/tmp/datavision-backend.log 2>&1 &
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 1
          done
      - name: Run backend contract smoke test
        run: python scripts/week7_backend_stub_smoke_test.py
      - name: Run mandatory UI-to-backend contract tests
        env:
          QS_USE_BACKEND: "true"
          BACKEND_BASE_URL: http://127.0.0.1:8000/api
        run: |
          python -m pip install -r demo/requirements-ci.txt
          python -m pip check
          python -m pytest tests/test_backend_contract_smoke.py -q

  shared-readiness-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install shared data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Check shared repository readiness
        run: python scripts/week7_shared_repo_readiness_check.py --strict

  integration-contract-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install shared data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Run local integration contract smoke test
        run: python scripts/week7_shared_integration_smoke_test.py

  # Owner jobs are mandatory after the Week 8 canonical merge. A missing or
  # changed canonical module fails module-parity instead of silently skipping.
  database-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: datavision
          POSTGRES_PASSWORD: datavision123
          POSTGRES_DB: datavision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datavision -d datavision_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            week7/database/requirements-ci.txt
      - name: Install database dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -r week7/database/requirements-ci.txt
          python -m pip check
      - name: Run database setup
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: datavision_db
          DB_USER: datavision
          DB_PASSWORD: datavision123
        run: |
          python scripts/week7_apply_database_schema.py
          python scripts/week7_apply_database_schema.py \
            --schema deployment/database/init/20_phat_schema_and_views.sql
          python scripts/load_ingestion_outputs_to_postgres.py --write-db --smoke
      - name: Run database smoke test
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: datavision_db
          POSTGRES_USER: datavision
          POSTGRES_PASSWORD: datavision123
        run: |
          if [ -f week7/database/scripts/ci_database_smoke_test.py ]; then
            python week7/database/scripts/ci_database_smoke_test.py
          else
            echo "Database smoke-test entrypoint is missing" >&2
            exit 1
          fi

  rag-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/rag/requirements-ci.txt
      - name: Install RAG CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai/rag/requirements-ci.txt
          python -m pip check
      - name: Run RAG CI smoke test
        run: python ai/rag/scripts/week7_rag_ci_smoke_test.py
      - name: Run RAG owner tests
        run: pytest ai/ai_tests/ -q

  prediction-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/prediction/requirements-ci.txt
      - name: Install prediction CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai/prediction/requirements-ci.txt
          python -m pip check
      - name: Run prediction CI smoke test
        run: python scripts/week7_prediction_ci_smoke_test.py
      - name: Run prediction owner tests
        run: pytest tests/ai_tests/ -q

  ui-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      QS_USE_BACKEND: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: demo/requirements-ci.txt
      - name: Install UI CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r demo/requirements-ci.txt
          python -m pip check
      - name: Run UI contract tests
        run: pytest tests/test_*.py -q
      - name: Run UI CI smoke test
        run: python scripts/week7_ui_ci_smoke_test.py

  security-source-ci:
    needs: module-parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked source and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-source.json
          exit-code: "1"
      - name: Generate CycloneDX source SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: datavision-source.cdx.json
          exit-code: "0"
      - name: Upload source security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week8-source-security-${{ github.sha }}
          path: |
            trivy-source.json
            datavision-source.cdx.json
          if-no-files-found: error

  week8-staging-compose-ci:
    needs:
      - module-parity
      - data-engineering-ci
      - data-db-loading-ci
      - backend-contract-ci
      - shared-readiness-ci
      - integration-contract-ci
      - database-ci
      - rag-ci
      - prediction-ci
      - ui-ci
      - security-source-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Week 8 Compose model
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f deployment/cloud/docker-compose.staging.yml \
            --env-file deployment/cloud/.env.staging.example config --quiet
      - name: Run clean-volume Week 8 staging acceptance
        run: >-
          python scripts/week8_staging_smoke_test.py
          --start
          --fresh
          --cleanup
          --project-name datavision-week8-ci
      - name: Upload staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week8-staging-acceptance
          path: outputs/integration/week8_staging_acceptance.json
          if-no-files-found: error
