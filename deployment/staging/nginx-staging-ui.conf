# DV-HUNG-07: authenticating reverse proxy for the staging Streamlit UI.
#
# Two independent controls, so a single mistake does not expose the UI:
#   1. IP allowlist  - only approved networks can reach the proxy at all.
#   2. Basic auth    - an approved network still needs reviewer credentials.
#
# Streamlit talks to the browser over a websocket, so the proxy must upgrade
# the connection and must not buffer or time out an idle session too quickly.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Proxy liveness only. Deliberately unauthenticated and carries no
    # application data, so it can be used by the container healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Streamlit's own liveness probe. Exact-match only, so the rest of the
    # /_stcore/ namespace - the websocket and the upload endpoint - stays behind
    # both controls. Left open because the canonical cloud acceptance check runs
    # from a GitHub-hosted runner whose address cannot be allowlisted, and this
    # endpoint returns a fixed "ok" carrying no application data.
    location = /_stcore/health {
        access_log off;
        proxy_pass http://ui:8501;
        proxy_set_header Host $host;
    }

    location / {
        # ── Control 1: network allowlist ───────────────────────────────────
        # Rendered at container start from STAGING_ALLOWED_CIDRS by
        # render-allowlist.sh. There is no default list here on purpose: the
        # proxy refuses to start when the variable is unset, so an unconfigured
        # deployment fails loudly instead of quietly serving a wider network
        # than the team approved.
        include /etc/nginx/allowlist.conf;
        deny all;

        # ── Control 2: reviewer credentials ────────────────────────────────
        auth_basic "DataVision staging - authorised reviewers only";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://ui:8501;
        proxy_http_version 1.1;

        # Streamlit websocket transport.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A staging session sits idle while a reviewer reads a report; do not
        # drop the websocket underneath them.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # Uploaded evidence files can be a few megabytes.
        client_max_body_size 25m;
    }
}
