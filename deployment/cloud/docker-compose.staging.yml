services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - datavision_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Force TCP readiness. The Unix socket can answer during initdb before
      # containers on the Compose network can connect, creating a first-run race.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  staging-seed:
    image: ${SEED_IMAGE:?SEED_IMAGE is required}
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RAG_EMBEDDING_MODE: ${RAG_EMBEDDING_MODE:-hash}
      DATAVISION_RELEASE_SHA: ${DATAVISION_RELEASE_SHA:?DATAVISION_RELEASE_SHA is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      DATAVISION_BACKEND_MODE: staging
      DATAVISION_RELEASE_SHA: ${DATAVISION_RELEASE_SHA:?DATAVISION_RELEASE_SHA is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      RAG_EMBEDDING_MODE: ${RAG_EMBEDDING_MODE:-hash}
    ports:
      # The API is consumed by Streamlit on the internal network. Binding it
      # to loopback keeps it available to the SSH acceptance tunnel without
      # publishing an unauthenticated API on the Internet.
      - "127.0.0.1:${BACKEND_PUBLIC_PORT:-8000}:8000"
    depends_on:
      staging-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 18

  ui:
    image: ${UI_IMAGE:?UI_IMAGE is required}
    pull_policy: always
    environment:
      QS_USE_BACKEND: "true"
      QS_BACKEND_URL: http://backend:8000/api
      DATAVISION_RELEASE_SHA: ${DATAVISION_RELEASE_SHA:?DATAVISION_RELEASE_SHA is required}
      QS_RELEASE_SHA: ${QS_RELEASE_SHA:?QS_RELEASE_SHA is required}
      QS_IMAGE_DIGEST: ${QS_IMAGE_DIGEST:?QS_IMAGE_DIGEST is required}
      QS_ENVIRONMENT: ${QS_ENVIRONMENT:-staging}
    ports:
      - "${UI_PUBLIC_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 18

volumes:
  datavision_pgdata:
